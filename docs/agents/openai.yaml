interface:
  display_name: "Instagram / 小红书 / 抖音 to Anki"
  short_description: "提取 Instagram、小红书、抖音的英语词汇并保存到 Anki，支持收藏夹增量同步"
  default_prompt: "Use $instagram-to-anki to download this post (Instagram, 小红书 or 抖音), extract challenging English words, and let me confirm the Anki cards. For favorites, import my exported inventory and sync only new items."
